name: promote

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version to promote (for example v012)"
        required: true
      model_artifact_uri:
        description: "Immutable artifact URI for the candidate model"
        required: true
      source_stage:
        description: "Source stage"
        required: true
        default: "staging"
      target_stage:
        description: "Target stage"
        required: true
        default: "production"
      approver:
        description: "Approver identity (mock/manual input for this portfolio project)"
        required: true

jobs:
  promote-model:
    runs-on: ubuntu-latest
    env:
      MODEL_VERSION: ${{ github.event.inputs.model_version }}
      MODEL_ARTIFACT_URI: ${{ github.event.inputs.model_artifact_uri }}
      SOURCE_STAGE: ${{ github.event.inputs.source_stage }}
      TARGET_STAGE: ${{ github.event.inputs.target_stage }}
      APPROVER: ${{ github.event.inputs.approver }}
      REQUESTED_BY: ${{ github.actor }}
      GIT_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate promotion inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          model_version = os.environ["MODEL_VERSION"]
          artifact_uri = os.environ["MODEL_ARTIFACT_URI"]
          source_stage = os.environ["SOURCE_STAGE"]
          target_stage = os.environ["TARGET_STAGE"]
          approver = os.environ["APPROVER"]

          if not re.fullmatch(r"v[0-9]{3,}", model_version):
              raise SystemExit("model_version must look like v012")
          for name, value in {
              "MODEL_ARTIFACT_URI": artifact_uri,
              "SOURCE_STAGE": source_stage,
              "TARGET_STAGE": target_stage,
              "APPROVER": approver,
          }.items():
              if not value:
                  raise SystemExit(f"{name} is required")
              if any(ch in value for ch in "\r\n\0"):
                  raise SystemExit(f"{name} contains unsupported control characters")
          if source_stage == target_stage:
              raise SystemExit("source_stage and target_stage must differ")
          PY

      - name: Mock stage gates
        run: |
          echo "Gate 1 (quality): PASS - placeholder"
          echo "Gate 2 (API contract smoke): PASS - placeholder"
          echo "Gate 3 (deployment health): PASS - placeholder"
          echo "In production, these would query real test/monitoring signals."

      - name: Approval note (mock)
        run: |
          echo "Approver: $APPROVER"
          echo "In production, use GitHub Environments required reviewers for enforced approvals."

      - name: Emit promotion record
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "model_version": os.environ["MODEL_VERSION"],
              "model_artifact_uri": os.environ["MODEL_ARTIFACT_URI"],
              "source_stage": os.environ["SOURCE_STAGE"],
              "target_stage": os.environ["TARGET_STAGE"],
              "approved_by": os.environ["APPROVER"],
              "requested_by": os.environ["REQUESTED_BY"],
              "git_sha": os.environ["GIT_SHA"],
              "run_id": os.environ["RUN_ID"],
          }
          Path("promotion_record.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cat promotion_record.json

      - name: Mock runtime model reference update
        run: |
          echo "Would update target runtime config:"
          echo "MODEL_VERSION=$MODEL_VERSION"
          echo "MODEL_ARTIFACT_URI=$MODEL_ARTIFACT_URI"
          echo "No cloud side effects are performed in this portfolio workflow."

      - name: Upload promotion record
        uses: actions/upload-artifact@v4
        with:
          name: promotion-record
          path: promotion_record.json
