# Inference pipeline: API tests + inference image build, or manual release build + metadata.
name: inference

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: "Target container repository (ECR or equivalent), without tag"
        required: true
      image_tag:
        description: "Optional image tag (default: inference-<short-sha>)"
        required: false
      aws_region:
        description: "AWS region for ECR operations"
        required: false
        default: "us-east-1"
  pull_request:
    paths:
      - "api/**"
      - "tests/test_api.py"
      - "tests/conftest.py"
      - "Dockerfile.inference"
      - "requirements.txt"
      - ".github/workflows/inference.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tests/test_api.py"
      - "tests/conftest.py"
      - "Dockerfile.inference"
      - "requirements.txt"
      - ".github/workflows/inference.yml"

jobs:
  inference-ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inference unit tests
        run: |
          echo "tests/test_api.py covers API behavior and model-loading paths (local MODEL_DIR and MODEL_ARTIFACT_URI variants)."
          pytest -q tests/test_api.py

      - name: Build inference Docker image
        run: |
          docker build -f Dockerfile.inference -t mlpipeline-inference:ci .

  build-inference-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inference unit tests
        run: |
          echo "tests/test_api.py covers API behavior and model-loading paths (local MODEL_DIR and MODEL_ARTIFACT_URI variants)."
          pytest -q tests/test_api.py

      - name: Resolve image metadata
        env:
          IMAGE_REPOSITORY: ${{ github.event.inputs.image_repository }}
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          export SHORT_SHA
          python - <<'PY'
          import os
          import re
          import sys

          repo = os.environ["IMAGE_REPOSITORY"]
          tag = os.environ["IMAGE_TAG_INPUT"] or f"inference-{os.environ['SHORT_SHA']}"
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:/-]+", repo):
              sys.exit("image_repository contains unsupported characters")
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag):
              sys.exit("image_tag contains unsupported characters")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"IMAGE_TAG={tag}\n")
              env_file.write(f"IMAGE_URI={repo}:{tag}\n")
          PY

      - name: Build model-agnostic inference image
        run: |
          docker build \
            -f Dockerfile.inference \
            -t "${IMAGE_URI}" .

      - name: Emit build metadata artifact
        env:
          AWS_REGION_INPUT: ${{ github.event.inputs.aws_region }}
        run: |
          set -euo pipefail
          GIT_SHA=$(git rev-parse HEAD)
          export GIT_SHA
          python - <<'PY'
          import json
          import os

          payload = {
              "image_uri": os.environ["IMAGE_URI"],
              "image_tag": os.environ["IMAGE_TAG"],
              "git_sha": os.environ["GIT_SHA"],
              "aws_region": os.environ["AWS_REGION_INPUT"],
              "note": "Pass MODEL_ARTIFACT_URI (and optional MODEL_VERSION) at deploy/runtime; not used to build this image.",
          }
          with open("inference_build_metadata.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          cat inference_build_metadata.json

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: inference-build-metadata
          path: inference_build_metadata.json

      - name: Push image (placeholder)
        run: |
          echo "TODO: Configure AWS credentials and ECR login."
          echo "TODO: docker push ${IMAGE_URI}"
          echo "At deploy time set e.g. MODEL_ARTIFACT_URI=s3://bucket/path/model.tar.gz"
