# Inference pipeline: API tests + inference image build, or manual release build + metadata.
name: inference

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: "Target container repository (ECR or equivalent), without tag"
        required: true
      image_tag:
        description: "Optional image tag (default: inference-<short-sha>)"
        required: false
      aws_region:
        description: "AWS region for ECR operations"
        required: false
        default: "us-east-1"
  pull_request:
    paths:
      - "api/**"
      - "tests/test_api.py"
      - "tests/conftest.py"
      - "Dockerfile.inference"
      - "requirements.txt"
      - ".github/workflows/inference.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tests/test_api.py"
      - "tests/conftest.py"
      - "Dockerfile.inference"
      - "requirements.txt"
      - ".github/workflows/inference.yml"

jobs:
  inference-ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inference unit tests
        run: |
          echo "tests/test_api.py covers API behavior and model-loading paths (local MODEL_DIR and MODEL_ARTIFACT_URI variants)."
          pytest -q tests/test_api.py

      - name: Build inference Docker image
        run: |
          docker build -f Dockerfile.inference -t mlpipeline-inference:ci .

  build-inference-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inference unit tests
        run: |
          echo "tests/test_api.py covers API behavior and model-loading paths (local MODEL_DIR and MODEL_ARTIFACT_URI variants)."
          pytest -q tests/test_api.py

      - name: Resolve image metadata
        env:
          IMAGE_REPOSITORY: ${{ github.event.inputs.image_repository }}
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import uuid
          from pathlib import Path

          tag = os.environ["IMAGE_TAG_INPUT"]
          if not tag:
              short_sha = subprocess.check_output(
                  ["git", "rev-parse", "--short", "HEAD"],
                  text=True,
              ).strip()
              tag = f"inference-{short_sha}"
          image_uri = f'{os.environ["IMAGE_REPOSITORY"]}:{tag}'

          def append_env(name: str, value: str) -> None:
              delimiter = f"EOF_{uuid.uuid4().hex}"
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
                  env_file.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")

          append_env("IMAGE_TAG", tag)
          append_env("IMAGE_URI", image_uri)
          PY

      - name: Build model-agnostic inference image
        run: |
          docker build \
            -f Dockerfile.inference \
            -t "${IMAGE_URI}" .

      - name: Emit build metadata artifact
        env:
          AWS_REGION: ${{ github.event.inputs.aws_region }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          payload = {
              "image_uri": os.environ["IMAGE_URI"],
              "image_tag": os.environ["IMAGE_TAG"],
              "git_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "aws_region": os.environ["AWS_REGION"],
              "note": "Pass MODEL_ARTIFACT_URI (and optional MODEL_VERSION) at deploy/runtime; not used to build this image.",
          }
          with open("inference_build_metadata.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          cat inference_build_metadata.json

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: inference-build-metadata
          path: inference_build_metadata.json

      - name: Push image (placeholder)
        run: |
          echo "TODO: Configure AWS credentials and ECR login."
          echo "TODO: docker push ${IMAGE_URI}"
          echo "At deploy time set e.g. MODEL_ARTIFACT_URI=s3://bucket/path/model.tar.gz"
