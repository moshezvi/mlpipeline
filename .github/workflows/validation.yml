name: validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lint checks
        run: ruff check .

      - name: Run training smoke check
        run: python training/train.py --samples 50 --output-dir runs/artifacts

      - name: Run unit tests
        run: pytest -q

      - name: API import smoke check
        run: python -c "from api.app import app; print(app.url_map)"

      - name: Build Docker image
        run: docker build -t mlpipeline-takehome:ci .
