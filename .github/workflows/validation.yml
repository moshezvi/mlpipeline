# PR / main: fast repo-wide quality gate only (no training or inference product smokes).
name: validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lint checks
        run: ruff check .

      - name: Run unit tests
        run: pytest -q
