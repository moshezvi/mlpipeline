# Training pipeline: unit tests + training smoke, or manual submit (local / AWS placeholder).
name: train

on:
  workflow_dispatch:
    inputs:
      train_backend:
        description: "Training backend: local or aws (placeholder)"
        required: true
        default: "local"
      data_uri:
        description: "Optional external training data CSV path/URI"
        required: false
      output_dir:
        description: "Training output directory"
        required: true
        default: "runs/artifacts"
      experiment_name:
        description: "Experiment name for tracking"
        required: true
        default: "mlpipeline-release"
      samples:
        description: "Sample size (used for synthetic fallback)"
        required: true
        default: "200"
      random_seed:
        description: "Random seed"
        required: true
        default: "42"
  pull_request:
    paths:
      - "training/**"
      - "tests/test_training.py"
      - "tests/conftest.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  push:
    branches: [main]
    paths:
      - "training/**"
      - "tests/test_training.py"
      - "tests/conftest.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"

jobs:
  training-ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Training unit tests
        run: pytest -q tests/test_training.py

      - name: Training smoke (end-to-end train)
        run: python training/train.py --samples 50 --output-dir runs/artifacts

  submit-training:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Training unit tests
        run: pytest -q tests/test_training.py

      - name: Select training backend
        env:
          TRAIN_BACKEND: ${{ github.event.inputs.train_backend }}
        run: |
          echo "Selected backend: $TRAIN_BACKEND"
          if [ "$TRAIN_BACKEND" != "local" ] && [ "$TRAIN_BACKEND" != "aws" ]; then
            echo "Unsupported backend. Use 'local' or 'aws'."
            exit 1
          fi

      - name: Train model (local fallback path)
        if: ${{ github.event.inputs.train_backend == 'local' }}
        env:
          INPUT_DATA_URI: ${{ github.event.inputs.data_uri }}
          INPUT_SAMPLES: ${{ github.event.inputs.samples }}
          INPUT_RANDOM_SEED: ${{ github.event.inputs.random_seed }}
          INPUT_OUTPUT_DIR: ${{ github.event.inputs.output_dir }}
          INPUT_EXPERIMENT_NAME: ${{ github.event.inputs.experiment_name }}
        run: |
          python training/train.py \
            --data-uri "$INPUT_DATA_URI" \
            --samples "$INPUT_SAMPLES" \
            --random-seed "$INPUT_RANDOM_SEED" \
            --output-dir "$INPUT_OUTPUT_DIR" \
            --experiment-name "$INPUT_EXPERIMENT_NAME"
          python - <<'PY'
          import json

          import os
          from pathlib import Path

          def append_github_env(name, value):
              value = str(value)
              if "\n" in value or "\r" in value:
                  raise ValueError(f"{name} contains a newline and cannot be written to GITHUB_ENV")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"{name}={value}\n")

          output_dir = Path(os.environ["INPUT_OUTPUT_DIR"])
          manifests = sorted(
              (output_dir / "runs").glob("v*/manifest.json"),
              key=lambda manifest_path: manifest_path.parent.name,
          )
          if not manifests:
              raise SystemExit(f"No run manifest found under {output_dir / 'runs'}")
          manifest = json.loads(manifests[-1].read_text(encoding="utf-8"))
          if not manifest.get("passed_quality_evaluation"):
              model_version = manifest.get("model_version", "<unknown>")
              raise SystemExit(
                  f"Model {model_version} failed quality evaluation; refusing release metadata"
              )

          model_version = str(manifest["model_version"])
          append_github_env("TRAIN_EXECUTION_ARN", f"local-run-{model_version}")
          append_github_env("MODEL_ARTIFACT_URI", manifest["model_path"])
          append_github_env("TRAIN_STATUS", "completed-local")
          PY

      - name: Submit training run (AWS placeholder)
        if: ${{ github.event.inputs.train_backend == 'aws' }}
        run: |
          echo "TODO: Build and push training container image to ECR (training entrypoint compatible with SageMaker)."
          echo "TODO: CreateTrainingJob or StartPipelineExecution with: input/output S3 URIs, hyperparameters/env,"
          echo "TODO: ResourceConfig (instance type, instance count, volume size), StoppingCondition, RoleArn, Region."
          echo "TODO: Optional VPC/Subnets/SecurityGroups; CloudWatch logging; align with README Plan for productization (1)."
          echo "TRAIN_EXECUTION_ARN=arn:aws:sagemaker:REGION:ACCOUNT:training-job/PLACEHOLDER" >> "$GITHUB_ENV"
          echo "MODEL_ARTIFACT_URI=s3://your-output-bucket/path/to/model.tar.gz" >> "$GITHUB_ENV"
          echo "TRAIN_STATUS=submitted-async" >> "$GITHUB_ENV"

      - name: Persist training submission metadata
        env:
          TRAIN_BACKEND: ${{ github.event.inputs.train_backend }}
          INPUT_DATA_URI: ${{ github.event.inputs.data_uri }}
          INPUT_OUTPUT_DIR: ${{ github.event.inputs.output_dir }}
          INPUT_EXPERIMENT_NAME: ${{ github.event.inputs.experiment_name }}
          INPUT_SAMPLES: ${{ github.event.inputs.samples }}
          INPUT_RANDOM_SEED: ${{ github.event.inputs.random_seed }}
        run: |
          python - <<'PY'
          import json
          import os

          payload = {
              "train_backend": os.environ["TRAIN_BACKEND"],
              "train_execution_arn": os.environ["TRAIN_EXECUTION_ARN"],
              "model_artifact_uri": os.environ["MODEL_ARTIFACT_URI"],
              "status": os.environ["TRAIN_STATUS"],
              "data_uri": os.environ["INPUT_DATA_URI"],
              "output_dir": os.environ["INPUT_OUTPUT_DIR"],
              "experiment_name": os.environ["INPUT_EXPERIMENT_NAME"],
              "samples": os.environ["INPUT_SAMPLES"],
              "random_seed": os.environ["INPUT_RANDOM_SEED"],
          }
          with open("training_submission.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload training submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-submission
          path: training_submission.json

      - name: Next step hint
        run: |
          echo "Training submission workflow completed."
          echo "Next workflow should monitor TRAIN_EXECUTION_ARN and continue release on success."
