# Training pipeline: unit tests + training smoke, or manual submit (local / AWS placeholder).
name: train

on:
  workflow_dispatch:
    inputs:
      train_backend:
        description: "Training backend: local or aws (placeholder)"
        required: true
        default: "local"
      data_uri:
        description: "Optional external training data CSV path/URI"
        required: false
      output_dir:
        description: "Training output directory"
        required: true
        default: "runs/artifacts"
      experiment_name:
        description: "Experiment name for tracking"
        required: true
        default: "mlpipeline-release"
      samples:
        description: "Sample size (used for synthetic fallback)"
        required: true
        default: "200"
      random_seed:
        description: "Random seed"
        required: true
        default: "42"
  pull_request:
    paths:
      - "training/**"
      - "tests/test_training.py"
      - "tests/conftest.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  push:
    branches: [main]
    paths:
      - "training/**"
      - "tests/test_training.py"
      - "tests/conftest.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"

jobs:
  training-ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Training unit tests
        run: pytest -q tests/test_training.py

      - name: Training smoke (end-to-end train)
        run: python training/train.py --samples 50 --output-dir runs/artifacts

  submit-training:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TRAIN_BACKEND: ${{ github.event.inputs.train_backend }}
      DATA_URI: ${{ github.event.inputs.data_uri }}
      OUTPUT_DIR: ${{ github.event.inputs.output_dir }}
      EXPERIMENT_NAME: ${{ github.event.inputs.experiment_name }}
      SAMPLES: ${{ github.event.inputs.samples }}
      RANDOM_SEED: ${{ github.event.inputs.random_seed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Training unit tests
        run: pytest -q tests/test_training.py

      - name: Select training backend
        run: |
          set -euo pipefail
          reject_control_chars() {
            case "$2" in
              *$'\n'*|*$'\r'*)
                echo "$1 must not contain newlines"
                exit 1
                ;;
            esac
          }

          reject_control_chars "train_backend" "$TRAIN_BACKEND"
          reject_control_chars "data_uri" "$DATA_URI"
          reject_control_chars "output_dir" "$OUTPUT_DIR"
          reject_control_chars "experiment_name" "$EXPERIMENT_NAME"
          reject_control_chars "samples" "$SAMPLES"
          reject_control_chars "random_seed" "$RANDOM_SEED"

          echo "Selected backend: $TRAIN_BACKEND"
          if [ "$TRAIN_BACKEND" != "local" ] && [ "$TRAIN_BACKEND" != "aws" ]; then
            echo "Unsupported backend. Use 'local' or 'aws'."
            exit 1
          fi
          if [[ ! "$SAMPLES" =~ ^[1-9][0-9]*$ ]]; then
            echo "samples must be a positive integer"
            exit 1
          fi
          if [[ ! "$RANDOM_SEED" =~ ^-?[0-9]+$ ]]; then
            echo "random_seed must be an integer"
            exit 1
          fi

      - name: Train model (local fallback path)
        if: ${{ env.TRAIN_BACKEND == 'local' }}
        run: |
          set -euo pipefail
          python training/train.py \
            --data-uri "$DATA_URI" \
            --samples "$SAMPLES" \
            --random-seed "$RANDOM_SEED" \
            --output-dir "$OUTPUT_DIR" \
            --experiment-name "$EXPERIMENT_NAME"
          MODEL_VERSION=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["OUTPUT_DIR"]) / "latest" / "manifest.json"
          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)
          if not manifest["passed_quality_evaluation"]:
              raise SystemExit("Quality evaluation failed. Blocking training release metadata.")
          print(manifest["model_version"])
          PY
          )
          MODEL_ARTIFACT_URI=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["OUTPUT_DIR"]) / "latest" / "manifest.json"
          with manifest_path.open("r", encoding="utf-8") as f:
              print(json.load(f)["model_path"])
          PY
          )
          echo "TRAIN_EXECUTION_ARN=local-run-${MODEL_VERSION}" >> "$GITHUB_ENV"
          echo "MODEL_ARTIFACT_URI=${MODEL_ARTIFACT_URI}" >> "$GITHUB_ENV"
          echo "TRAIN_STATUS=completed-local" >> "$GITHUB_ENV"

      - name: Submit training run (AWS placeholder)
        if: ${{ env.TRAIN_BACKEND == 'aws' }}
        run: |
          echo "TODO: Build and push training container image to ECR (training entrypoint compatible with SageMaker)."
          echo "TODO: CreateTrainingJob or StartPipelineExecution with: input/output S3 URIs, hyperparameters/env,"
          echo "TODO: ResourceConfig (instance type, instance count, volume size), StoppingCondition, RoleArn, Region."
          echo "TODO: Optional VPC/Subnets/SecurityGroups; CloudWatch logging; align with README Plan for productization (1)."
          echo "TRAIN_EXECUTION_ARN=arn:aws:sagemaker:REGION:ACCOUNT:training-job/PLACEHOLDER" >> "$GITHUB_ENV"
          echo "MODEL_ARTIFACT_URI=s3://your-output-bucket/path/to/model.tar.gz" >> "$GITHUB_ENV"
          echo "TRAIN_STATUS=submitted-async" >> "$GITHUB_ENV"

      - name: Persist training submission metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          payload = {
              "train_backend": os.environ["TRAIN_BACKEND"],
              "train_execution_arn": os.environ["TRAIN_EXECUTION_ARN"],
              "model_artifact_uri": os.environ["MODEL_ARTIFACT_URI"],
              "status": os.environ["TRAIN_STATUS"],
              "data_uri": os.environ["DATA_URI"],
              "output_dir": os.environ["OUTPUT_DIR"],
              "experiment_name": os.environ["EXPERIMENT_NAME"],
              "samples": os.environ["SAMPLES"],
              "random_seed": os.environ["RANDOM_SEED"],
          }
          with open("training_submission.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          python -m json.tool training_submission.json

      - name: Upload training submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-submission
          path: training_submission.json

      - name: Next step hint
        run: |
          echo "Training submission workflow completed."
          echo "Next workflow should monitor TRAIN_EXECUTION_ARN and continue release on success."
