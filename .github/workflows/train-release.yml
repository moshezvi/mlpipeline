name: train-release

on:
  workflow_dispatch:
    inputs:
      train_backend:
        description: "Training backend: local or aws (placeholder)"
        required: true
        default: "local"
      data_uri:
        description: "Optional external training data CSV path/URI"
        required: false
      output_dir:
        description: "Training output directory"
        required: true
        default: "runs/artifacts"
      experiment_name:
        description: "Experiment name for tracking"
        required: true
        default: "mlpipeline-release"
      samples:
        description: "Sample size (used for synthetic fallback)"
        required: true
        default: "200"
      random_seed:
        description: "Random seed"
        required: true
        default: "42"

jobs:
  train-register-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select training backend
        run: |
          echo "Selected backend: ${{ github.event.inputs.train_backend }}"
          if [ "${{ github.event.inputs.train_backend }}" != "local" ] && [ "${{ github.event.inputs.train_backend }}" != "aws" ]; then
            echo "Unsupported backend. Use 'local' or 'aws'."
            exit 1
          fi

      - name: Train model (local path)
        if: ${{ github.event.inputs.train_backend == 'local' }}
        run: |
          python training/train.py \
            --data-uri "${{ github.event.inputs.data_uri }}" \
            --samples "${{ github.event.inputs.samples }}" \
            --random-seed "${{ github.event.inputs.random_seed }}" \
            --output-dir "${{ github.event.inputs.output_dir }}" \
            --experiment-name "${{ github.event.inputs.experiment_name }}"

      - name: Train model (AWS placeholder)
        if: ${{ github.event.inputs.train_backend == 'aws' }}
        run: |
          echo "TODO: Submit remote training job (e.g., SageMaker Training Job)."
          echo "TODO: Wait for completion and pull training manifest/artifact URIs."
          exit 1

      - name: Resolve manifest location
        run: |
          MANIFEST_PATH="${{ github.event.inputs.output_dir }}/latest/manifest.json"
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"
          echo "Expected manifest path: $MANIFEST_PATH"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "Manifest not found."
            exit 1
          fi

      - name: Validate manifest and guardrail
        id: manifest_check
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          manifest_path = os.environ["MANIFEST_PATH"]
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          required_keys = [
              "model_version",
              "model_path",
              "metrics_path",
              "passed_guardrail",
              "created_at_utc",
          ]
          missing = [k for k in required_keys if k not in manifest]
          if missing:
              print(f"Manifest missing required keys: {missing}")
              sys.exit(1)

          model_version = str(manifest["model_version"])
          passed_guardrail = bool(manifest["passed_guardrail"])

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as out:
              out.write(f"model_version={model_version}\n")
              out.write(f"passed_guardrail={'true' if passed_guardrail else 'false'}\n")
          PY

      - name: Enforce guardrail
        if: ${{ steps.manifest_check.outputs.passed_guardrail != 'true' }}
        run: |
          echo "Guardrail failed. Blocking registration and release."
          exit 1

      - name: Register model (placeholder)
        if: ${{ steps.manifest_check.outputs.passed_guardrail == 'true' }}
        run: |
          echo "TODO: Register model version ${{ steps.manifest_check.outputs.model_version }} in model registry."

      - name: Build and push inference image (placeholder)
        if: ${{ steps.manifest_check.outputs.passed_guardrail == 'true' }}
        run: |
          echo "TODO: Build image pinned to model_version=${{ steps.manifest_check.outputs.model_version }}."
          echo "TODO: Push image to container registry."
